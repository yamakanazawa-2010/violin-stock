<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工房在庫">
<meta name="theme-color" content="#f7f3ec">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%233d332a'/%3E%3Ctext x='90' y='122' font-size='90' text-anchor='middle' fill='%23f7f3ec' font-family='sans-serif' font-weight='bold'%3E駒%3C/text%3E%3C/svg%3E">
<title>工房パーツ在庫</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  html { touch-action:manipulation; }
  button { touch-action:manipulation; }
  input { -webkit-user-select:text; user-select:text; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  html,body { background:#f7f3ec; color:#2f2820; font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif; }
  body { padding-bottom:40px; -webkit-overflow-scrolling:touch; }
  button:active { transform:scale(0.96); transition:transform .05s; }
  ::-webkit-scrollbar { height:0; width:0; }

  .wrap { max-width:900px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:flex-start; padding:calc(env(safe-area-inset-top) + 20px) 20px 16px; }
  h1 { font-size:28px; font-weight:800; letter-spacing:.02em; }
  .sub { margin-top:6px; font-size:14px; color:#7a6f62; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .lowBadge { display:inline-flex; align-items:center; gap:4px; background:#fbe9d6; color:#c07a1e; padding:2px 9px; border-radius:999px; font-size:12.5px; font-weight:700; }
  .headBtns { display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .addBtn { display:flex; align-items:center; gap:6px; background:#3d332a; color:#fff; border:none; border-radius:14px; padding:12px 18px; font-size:16px; font-weight:700; box-shadow:0 3px 10px rgba(61,51,42,.25); }
  .xlsxBtn { display:flex; align-items:center; gap:6px; background:#fff; color:#3d332a; border:1.5px solid #d9cdbb; border-radius:14px; padding:10px 16px; font-size:14px; font-weight:700; }

  .searchWrap { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #e7ded0; border-radius:14px; padding:12px 16px; margin:0 20px; }
  .searchWrap input { flex:1; border:none; outline:none; font-size:17px; background:transparent; color:#2f2820; }
  .clearBtn { border:none; background:#f0e9dd; color:#7a6f62; border-radius:999px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }

  .filterLabel { font-size:12px; font-weight:800; color:#a89b8c; letter-spacing:.08em; padding:16px 20px 0; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 20px 0; }
  .chip { flex-shrink:0; background:#fff; border:1.5px solid #e7ded0; color:#6e6259; border-radius:999px; padding:9px 18px; font-size:15px; font-weight:700; white-space:nowrap; }
  .sizeChip { flex-shrink:0; background:#fff; border:1.5px solid #e7ded0; color:#6e6259; border-radius:999px; padding:9px 16px; font-size:15px; font-weight:800; white-space:nowrap; min-width:52px; }

  .list { display:flex; flex-direction:column; gap:12px; padding:16px 20px 0; }
  .card { position:relative; display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #ece4d6; border-radius:18px; padding:14px 16px; box-shadow:0 1px 3px rgba(61,51,42,.06); }
  .card.low { border-color:#f0d0a0; background:#fffdf8; }
  .card.out { border-color:#e6b3b3; background:#fef7f6; }
  .leftCol { display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; }
  .thumb { width:62px; height:62px; border-radius:12px; overflow:hidden; flex-shrink:0; }
  .thumbBtn { border:none; padding:0; background:transparent; cursor:pointer; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumbPh { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:26px; font-weight:800; }
  .editBtn { display:flex; align-items:center; justify-content:center; gap:3px; width:62px; padding:5px 0; border-radius:8px; border:1px solid #dfe0d6; background:#fff; color:#6b7a5a; font-size:11px; font-weight:700; }
  .editBtn:active { background:#eef1e6; color:#4e5c3f; }
  .body { flex:1; min-width:0; }
  .cardTop { display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap; }
  .catTag { font-size:11.5px; font-weight:800; border:1.2px solid; border-radius:6px; padding:1px 7px; }
  .sizeTag { font-size:11.5px; font-weight:800; color:#3d332a; background:#efe7d8; border-radius:6px; padding:1px 8px; }
  .statusLow { font-size:11.5px; font-weight:800; color:#c07a1e; background:#fbe9d6; border-radius:6px; padding:1px 7px; }
  .statusOut { font-size:11.5px; font-weight:800; color:#b23b3b; background:#fadede; border-radius:6px; padding:1px 7px; }
  .name { margin:2px 0; font-size:17px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .minText { font-size:12.5px; color:#9a8f82; }
  .counter { display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; }
  .counterRow { display:flex; align-items:center; gap:4px; }
  .stepBtn { width:48px; height:48px; border-radius:12px; border:none; background:#f0e9dd; color:#3d332a; display:flex; align-items:center; justify-content:center; }
  .stepBtn:disabled { opacity:.4; }
  .qtyBox { display:flex; flex-direction:column; align-items:center; min-width:52px; }
  .qtyNum { font-size:28px; font-weight:800; line-height:1; }
  .qtyUnit { font-size:11px; color:#9a8f82; margin-top:1px; }
  .bulkBtn { border:none; background:transparent; color:#8a7d6d; font-size:12px; font-weight:700; text-decoration:underline; padding:2px 4px; }
  .delBtn { display:flex; align-items:center; justify-content:center; gap:3px; width:62px; padding:5px 0; border-radius:8px; border:1px solid #ecdada; background:#fff; color:#b07a7a; font-size:11px; font-weight:700; }
  .delBtn:active { background:#fadede; color:#b23b3b; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; color:#9a8f82; }
  .empty p.t { margin:12px 0 4px; font-weight:600; color:#6e6259; }

  .overlay { position:fixed; inset:0; background:rgba(47,40,32,.5); display:flex; align-items:flex-end; justify-content:center; z-index:100; }
  .modal { background:#f7f3ec; border-radius:24px 24px 0 0; width:100%; max-width:560px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.2); padding-bottom:env(safe-area-inset-bottom); }
  .modalHead { display:flex; justify-content:space-between; align-items:center; padding:20px 20px 12px; }
  .modalHead h2 { font-size:22px; font-weight:800; }
  .modalClose { border:none; background:#ece4d6; color:#6e6259; border-radius:999px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; }
  .modalBody { padding:0 20px; overflow-y:auto; flex:1; }
  .modalFoot { display:flex; gap:12px; padding:20px; }
  .photoPick { width:100%; height:150px; border:2px dashed #d9cdbb; border-radius:16px; background:#fff; overflow:hidden; padding:0; margin-bottom:8px; }
  .photoEmpty { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#a89b8c; }
  .photoEmpty span { font-size:14px; color:#9a8f82; margin-top:6px; }
  .photoPick img { width:100%; height:100%; object-fit:cover; }
  label.lb { display:block; font-size:14px; font-weight:700; color:#7a6f62; margin:16px 0 7px; }
  .field { width:100%; border:1.5px solid #e2d8c8; border-radius:12px; padding:13px 15px; font-size:17px; outline:none; background:#fff; color:#2f2820; }
  .optGrid { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { border:1.5px solid #e2d8c8; background:#fff; color:#6e6259; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:700; }
  .optAdd { border-style:dashed; color:#8a7d6d; }
  .row { display:flex; gap:14px; }
  .numField { display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid #e2d8c8; border-radius:12px; padding:5px; }
  .numBtn { width:42px; height:42px; border-radius:9px; border:none; background:#f0e9dd; color:#3d332a; display:flex; align-items:center; justify-content:center; }
  .numInput { flex:1; width:100%; min-width:0; border:none; outline:none; text-align:center; font-size:20px; font-weight:800; background:transparent; color:#2f2820; }
  .cancelBtn { flex:1; border:1.5px solid #d9cdbb; background:transparent; color:#6e6259; border-radius:14px; padding:15px; font-size:17px; font-weight:700; }
  .saveBtn { flex:2; border:none; background:#3d332a; color:#fff; border-radius:14px; padding:15px; font-size:17px; font-weight:800; }
  .saveBtn:disabled { opacity:.4; }

  /* まとめて入出庫モーダル */
  .bulkModal { background:#f7f3ec; border-radius:24px; width:calc(100% - 40px); max-width:420px; box-shadow:0 8px 30px rgba(0,0,0,.25); padding:22px; }
  .bulkName { font-size:18px; font-weight:800; margin-bottom:4px; }
  .bulkCur { font-size:13px; color:#7a6f62; margin-bottom:16px; }
  .bulkToggle { display:flex; gap:8px; margin-bottom:16px; }
  .bulkTgBtn { flex:1; border:1.5px solid #e2d8c8; background:#fff; color:#6e6259; border-radius:12px; padding:12px; font-size:15px; font-weight:800; }
  .bulkTgBtn.on-in { background:#2f6d4f; color:#fff; border-color:#2f6d4f; }
  .bulkTgBtn.on-out { background:#b23b3b; color:#fff; border-color:#b23b3b; }
  .bulkPreview { text-align:center; font-size:14px; color:#7a6f62; margin-top:14px; }
  .bulkPreview b { font-size:20px; color:#2f2820; }
  .overlayCenter { position:fixed; inset:0; background:rgba(47,40,32,.5); display:flex; align-items:center; justify-content:center; z-index:110; }
  svg { display:block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── ダブルタップ拡大の抑止(iPad Safari対策) ─────────────────────────
let __lastTouch = 0;
document.addEventListener("touchend", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) { __lastTouch = 0; return; }
  const now = Date.now();
  if (now - __lastTouch <= 350) { e.preventDefault(); }
  __lastTouch = now;
}, { passive:false });
// ピンチ拡大の抑止
document.addEventListener("gesturestart", e => e.preventDefault());

// ── アイコン(inline SVG) ─────────────────────────
const ic = {
  plus:(s=22,w=2.5)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  minus:(s=26,w=3)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><path d="M5 12h14"/></svg>`,
  x:(s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  search:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
  cam:(s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>`,
  trash:(s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  pkg:(s=48)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>`,
  warn:(s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-9-16a2 2 0 0 0-3.4 0l-9 16A2 2 0 0 0 3 21h18a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg>`,
  xlsx:(s=17)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13l3 4M11 13l-3 4"/></svg>`,
  save:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>`,
  load:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 9l5-5 5 5M12 4v12"/></svg>`,
  pencil:(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
};

// ── カテゴリー ─────────────────────────
const BASE_CATEGORIES = [
  { id:"koma", label:"駒", color:"#8B5E3C" },
  { id:"gen", label:"弦", color:"#C08457" },
  { id:"kataate", label:"肩当て", color:"#6B7A5A" },
  { id:"tailpiece", label:"テールピース", color:"#4A5A6B" },
  { id:"peg", label:"ペグ", color:"#7A4A4A" },
  { id:"adjuster", label:"アジャスター", color:"#9A7B4F" },
  { id:"other", label:"その他", color:"#6E6259" },
];
// ユーザー追加分類用の色パレット(順番に割り当て)
const CAT_COLORS = ["#5B7B8A","#8A5B7B","#7B8A5B","#8A785B","#5B8A78","#785B8A","#8A5B5B","#5B6E8A"];
const CAT_KEY = "violin_categories_v1";
const loadCats = () => { try { return JSON.parse(localStorage.getItem(CAT_KEY)) || []; } catch { return []; } };
const saveCats = arr => { try { localStorage.setItem(CAT_KEY, JSON.stringify(arr)); } catch(e){ console.error(e); } };
// 「その他」より前にユーザー分類を挟む(その他は常に末尾)
function buildCategories(){
  const user = loadCats();
  const base = BASE_CATEGORIES.filter(c=>c.id!=="other");
  const other = BASE_CATEGORIES.find(c=>c.id==="other");
  return [...base, ...user, other];
}
let CATEGORIES = buildCategories();
const catById = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES.find(c=>c.id==="other");

// ── サイズ ─────────────────────────
const SIZES = [
  { id:"4/4", label:"4/4" },
  { id:"3/4", label:"3/4" },
  { id:"1/2", label:"1/2" },
  { id:"1/4", label:"1/4" },
  { id:"1/8", label:"1/8" },
  { id:"none", label:"指定なし" },
];
const sizeLabel = id => (SIZES.find(s=>s.id===id) || {label:"指定なし"}).label;

// ── データ保存(localStorage) ─────────────────────────
const KEY = "violin_inventory_v2";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state.items)); } catch(e){ console.error(e); } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const SEED = [
  { id:"s1", name:"Aubert 駒 (フランス製)", category:"koma", size:"4/4", qty:12, min:3, photo:null },
  { id:"s2", name:"Dominant A線", category:"gen", size:"none", qty:8, min:4, photo:null },
  { id:"s3", name:"Kun 肩当て", category:"kataate", size:"4/4", qty:2, min:2, photo:null },
  { id:"s4", name:"黒檀ペグ 4本セット", category:"peg", size:"3/4", qty:5, min:2, photo:null },
];

const state = { items: load() ?? SEED, filter:"all", sizeFilter:"all", search:"", modal:false, draft:null, bulk:null };
if(!load()) save();

const esc = s => String(s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// ── 描画 ─────────────────────────
function render(){
  const app = document.getElementById("app");
  const items = state.items;
  const low = items.filter(i=>i.qty<=i.min).length;
  const total = items.reduce((s,i)=>s+i.qty,0);
  const filtered = items.filter(i =>
    (state.filter==="all" || i.category===state.filter) &&
    (state.sizeFilter==="all" || (i.size||"none")===state.sizeFilter) &&
    i.name.toLowerCase().includes(state.search.toLowerCase())
  );

  app.innerHTML = `
    <div class="wrap">
      <header>
        <div>
          <h1>工房パーツ在庫</h1>
          <div class="sub">
            ${items.length} 種類 ・ 合計 ${total} 個
            ${low>0 ? `<span class="lowBadge">${ic.warn()} 要補充 ${low}</span>` : ""}
          </div>
        </div>
        <div class="headBtns">
          <button class="addBtn" id="openAdd">${ic.plus()}<span>追加</span></button>
          <button class="xlsxBtn" id="exportBtn">${ic.xlsx()}<span>Excel出力</span></button>
          <button class="xlsxBtn" id="backupBtn">${ic.save(16)}<span>バックアップ</span></button>
          <button class="xlsxBtn" id="restoreBtn">${ic.load(16)}<span>復元</span></button>
          <input type="file" id="restoreInput" accept="application/json,.json" style="display:none">
        </div>
      </header>

      <div class="searchWrap">
        ${ic.search()}
        <input id="search" placeholder="パーツ名で検索" value="${esc(state.search)}">
        ${state.search ? `<button class="clearBtn" id="clearSearch">${ic.x(18)}</button>` : ""}
      </div>

      <div class="filterLabel">種類</div>
      <div class="chips" id="chips">
        <button class="chip" data-cat="all" style="${state.filter==="all"?"background:#3d332a;color:#fff;border-color:#3d332a":""}">すべて</button>
        ${CATEGORIES.map(c=>`<button class="chip" data-cat="${c.id}" style="${state.filter===c.id?`background:${c.color};color:#fff;border-color:${c.color}`:""}">${c.label}</button>`).join("")}
      </div>

      <div class="filterLabel">サイズ</div>
      <div class="chips" id="sizeChips">
        <button class="sizeChip" data-size="all" style="${state.sizeFilter==="all"?"background:#3d332a;color:#fff;border-color:#3d332a":""}">すべて</button>
        ${SIZES.map(s=>`<button class="sizeChip" data-size="${s.id}" style="${state.sizeFilter===s.id?"background:#3d332a;color:#fff;border-color:#3d332a":""}">${s.label}</button>`).join("")}
      </div>

      <div class="list">
        ${filtered.length===0 ? `
          <div class="empty">
            ${ic.pkg()}
            <p class="t">該当するパーツがありません</p>
            <p style="font-size:14px">右上の「追加」から登録できます</p>
          </div>` :
          filtered.map(cardHtml).join("")}
      </div>
    </div>
    ${state.modal ? modalHtml() : ""}
    ${state.bulk ? bulkHtml() : ""}
  `;
  bind();
}

function cardHtml(it){
  const cat = catById(it.category);
  const size = it.size || "none";
  const low = it.qty<=it.min, out = it.qty===0;
  const numColor = out?"#b23b3b":low?"#c07a1e":"#2f2820";
  return `
    <div class="card ${out?"out":low?"low":""}">
      <div class="leftCol">
        <button class="thumb thumbBtn" data-edit="${it.id}">
          ${it.photo ? `<img src="${it.photo}" alt="">` :
            `<div class="thumbPh" style="background:${cat.color}">${cat.label.slice(0,1)}</div>`}
        </button>
        <button class="editBtn" data-edit="${it.id}">${ic.pencil(14)}<span>編集</span></button>
        <button class="delBtn" data-del="${it.id}">${ic.trash(15)}<span>削除</span></button>
      </div>
      <div class="body">
        <div class="cardTop">
          <span class="catTag" style="color:${cat.color};border-color:${cat.color}">${cat.label}</span>
          ${size!=="none" ? `<span class="sizeTag">${sizeLabel(size)}</span>` : ""}
          ${out?`<span class="statusOut">在庫切れ</span>`:low?`<span class="statusLow">残りわずか</span>`:""}
        </div>
        <div class="name">${esc(it.name)}</div>
        <div class="minText">最低在庫 ${it.min}</div>
      </div>
      <div class="counter">
        <div class="counterRow">
          <button class="stepBtn" data-dec="${it.id}" ${it.qty===0?"disabled":""}>${ic.minus()}</button>
          <div class="qtyBox">
            <span class="qtyNum" style="color:${numColor}">${it.qty}</span>
            <span class="qtyUnit">個</span>
          </div>
          <button class="stepBtn" data-inc="${it.id}">${ic.plus(26,3)}</button>
        </div>
        <button class="bulkBtn" data-bulk="${it.id}">まとめて増減</button>
      </div>
    </div>`;
}

function modalHtml(){
  const d = state.draft;
  const editing = !!d.editId;
  return `
    <div class="overlay" id="overlay">
      <div class="modal" id="modal">
        <div class="modalHead">
          <h2>${editing ? "パーツを編集" : "パーツを追加"}</h2>
          <button class="modalClose" id="closeModal">${ic.x()}</button>
        </div>
        <div class="modalBody">
          <button class="photoPick" id="photoPick">
            ${d.photo ? `<img src="${d.photo}" alt="">` :
              `<div class="photoEmpty">${ic.cam()}<span>写真を追加</span></div>`}
          </button>
          <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

          <label class="lb">パーツ名</label>
          <input class="field" id="dName" value="${esc(d.name)}" placeholder="例）Aubert 駒 フランス製">

          <label class="lb">種類</label>
          <div class="optGrid" id="catGrid">
            ${CATEGORIES.map(c=>`<button class="opt" data-c="${c.id}" style="${d.category===c.id?`background:${c.color};color:#fff;border-color:${c.color}`:""}">${c.label}</button>`).join("")}
            <button class="opt optAdd" id="addCatBtn">＋ 種類を追加</button>
          </div>

          <label class="lb">サイズ</label>
          <div class="optGrid" id="sizeGrid">
            ${SIZES.map(s=>`<button class="opt" data-s="${s.id}" style="${d.size===s.id?"background:#3d332a;color:#fff;border-color:#3d332a":""}">${s.label}</button>`).join("")}
          </div>

          <div class="row">
            <div style="flex:1">
              <label class="lb">初期在庫数</label>
              <div class="numField">
                <button class="numBtn" data-qd>${ic.minus(20,3)}</button>
                <input class="numInput" id="dQty" type="number" value="${d.qty}">
                <button class="numBtn" data-qi>${ic.plus(20,3)}</button>
              </div>
            </div>
            <div style="flex:1">
              <label class="lb">最低在庫数</label>
              <div class="numField">
                <button class="numBtn" data-md>${ic.minus(20,3)}</button>
                <input class="numInput" id="dMin" type="number" value="${d.min}">
                <button class="numBtn" data-mi>${ic.plus(20,3)}</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modalFoot">
          <button class="cancelBtn" id="cancelBtn">キャンセル</button>
          <button class="saveBtn" id="saveBtn" ${d.name.trim()?"":"disabled"}>${editing ? "保存する" : "登録する"}</button>
        </div>
      </div>
    </div>`;
}

function bulkHtml(){
  const b = state.bulk;
  const it = state.items.find(i=>i.id===b.id);
  if(!it) return "";
  const n = Math.max(0, +b.n || 0);
  const delta = b.mode==="in" ? n : -n;
  const result = Math.max(0, it.qty + delta);
  return `
    <div class="overlayCenter" id="bulkOverlay">
      <div class="bulkModal" id="bulkModal">
        <div class="bulkName">${esc(it.name)}</div>
        <div class="bulkCur">現在の在庫 ${it.qty} 個</div>
        <div class="bulkToggle">
          <button class="bulkTgBtn ${b.mode==="in"?"on-in":""}" data-mode="in">入庫（＋）</button>
          <button class="bulkTgBtn ${b.mode==="out"?"on-out":""}" data-mode="out">出庫（−）</button>
        </div>
        <label class="lb" style="margin-top:0">個数</label>
        <div class="numField">
          <button class="numBtn" data-bd>${ic.minus(20,3)}</button>
          <input class="numInput" id="bulkN" type="number" value="${b.n}">
          <button class="numBtn" data-bi>${ic.plus(20,3)}</button>
        </div>
        <div class="bulkPreview">変更後の在庫　<b>${result}</b> 個</div>
        <div class="modalFoot" style="padding:18px 0 0">
          <button class="cancelBtn" id="bulkCancel">キャンセル</button>
          <button class="saveBtn" id="bulkApply">確定する</button>
        </div>
      </div>
    </div>`;
}

// ── Excel出力 ─────────────────────────
function exportXlsx(){
  const rows = state.items.map(it => ({
    "パーツ名": it.name,
    "種類": catById(it.category).label,
    "サイズ": (it.size && it.size!=="none") ? sizeLabel(it.size) : "指定なし",
    "在庫数": it.qty,
    "最低在庫数": it.min,
    "状態": it.qty===0 ? "在庫切れ" : (it.qty<=it.min ? "残りわずか" : "在庫あり"),
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [ {wch:32},{wch:14},{wch:10},{wch:10},{wch:12},{wch:12} ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "在庫一覧");
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  const fname = `工房在庫_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.xlsx`;
  XLSX.writeFile(wb, fname);
}

// ── バックアップ(JSON書き出し) ─────────────────────────
function backupJson(){
  const data = { app:"violin-stock", version:2, savedAt:new Date().toISOString(), items:state.items, categories:loadCats() };
  const blob = new Blob([JSON.stringify(data)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url;
  a.download = `工房在庫_バックアップ_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ── 復元(JSON読み込み) ─────────────────────────
function restoreJson(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const items = Array.isArray(data) ? data : data.items;
      if(!Array.isArray(items)) throw new Error("形式が違います");
      // 最低限の項目チェック
      const clean = items.map(it => ({
        id: it.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
        name: String(it.name||"名称未設定"),
        category: it.category || "other",
        size: it.size || "none",
        qty: Math.max(0, parseInt(it.qty)||0),
        min: Math.max(0, parseInt(it.min)||0),
        photo: it.photo || null,
      }));
      if(!confirm(`このバックアップ(${clean.length}件)で今の在庫を置き換えます。よろしいですか?`)) return;
      // ユーザー追加分類も復元(あれば)
      if(Array.isArray(data.categories)){
        const cats = data.categories.filter(c=>c&&c.id&&c.label).map(c=>({ id:String(c.id), label:String(c.label), color:c.color||"#5B7B8A" }));
        saveCats(cats);
        CATEGORIES = buildCategories();
      }
      state.items = clean;
      save();
      render();
      alert("復元しました");
    } catch(e) {
      alert("このファイルは読み込めませんでした。バックアップ用のJSONファイルを選んでください。");
    }
  };
  r.readAsText(file);
}

// ── イベント ─────────────────────────
function bind(){
  const q = id => document.getElementById(id);

  q("openAdd").onclick = () => { state.draft={ name:"", category:"koma", size:"4/4", qty:1, min:2, photo:null }; state.modal=true; render(); };
  q("exportBtn").onclick = () => { if(state.items.length===0){ alert("出力するパーツがありません"); return; } exportXlsx(); };
  q("backupBtn").onclick = () => { if(state.items.length===0){ alert("バックアップするパーツがありません"); return; } backupJson(); };
  q("restoreBtn").onclick = () => q("restoreInput").click();
  q("restoreInput").onchange = e => { const f=e.target.files[0]; if(f){ restoreJson(f); e.target.value=""; } };

  const s = q("search");
  if(s) s.oninput = e => { state.search=e.target.value; const p=e.target.selectionStart; render(); const n=document.getElementById("search"); if(n){ n.focus(); n.setSelectionRange(p,p);} };
  if(q("clearSearch")) q("clearSearch").onclick = () => { state.search=""; render(); };

  document.querySelectorAll("[data-cat]").forEach(b=> b.onclick=()=>{ state.filter=b.dataset.cat; render(); });
  document.querySelectorAll("[data-size]").forEach(b=> b.onclick=()=>{ state.sizeFilter=b.dataset.size; render(); });
  document.querySelectorAll("[data-inc]").forEach(b=> b.onclick=()=>{ chg(b.dataset.inc,1); });
  document.querySelectorAll("[data-dec]").forEach(b=> b.onclick=()=>{ chg(b.dataset.dec,-1); });
  document.querySelectorAll("[data-bulk]").forEach(b=> b.onclick=()=>{ state.bulk={ id:b.dataset.bulk, mode:"in", n:10 }; render(); });
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{ if(confirm("このパーツを削除しますか?")){ state.items=state.items.filter(i=>i.id!==b.dataset.del); save(); render(); } });
  document.querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=>{
    const it = state.items.find(i=>i.id===b.dataset.edit);
    if(!it) return;
    state.draft = { editId:it.id, name:it.name, category:it.category, size:it.size||"none", qty:it.qty, min:it.min, photo:it.photo||null };
    state.modal = true; render();
  });

  if(state.modal){
    q("overlay").onclick = e => { if(e.target.id==="overlay"){ state.modal=false; render(); } };
    q("closeModal").onclick = q("cancelBtn").onclick = () => { state.modal=false; render(); };
    q("dName").oninput = e => { state.draft.name=e.target.value; q("saveBtn").disabled=!e.target.value.trim(); };
    document.querySelectorAll("[data-c]").forEach(b=> b.onclick=()=>{ state.draft.category=b.dataset.c; render(); });
    q("addCatBtn").onclick = () => {
      const name = (prompt("追加する種類の名前を入力してください（例：あご当て、松脂、弓）") || "").trim();
      if(!name) return;
      // 同名チェック
      const dup = CATEGORIES.find(c=>c.label===name);
      if(dup){ state.draft.category = dup.id; render(); return; }
      const user = loadCats();
      const newCat = { id:"u"+uid(), label:name, color:CAT_COLORS[user.length % CAT_COLORS.length] };
      user.push(newCat);
      saveCats(user);
      CATEGORIES = buildCategories();
      state.draft.category = newCat.id;
      render();
    };
    document.querySelectorAll("[data-s]").forEach(b=> b.onclick=()=>{ state.draft.size=b.dataset.s; render(); });
    q("dQty").oninput = e => state.draft.qty = e.target.value;
    q("dMin").oninput = e => state.draft.min = e.target.value;
    document.querySelector("[data-qd]").onclick=()=>{ state.draft.qty=Math.max(0,(+state.draft.qty||0)-1); render(); };
    document.querySelector("[data-qi]").onclick=()=>{ state.draft.qty=(+state.draft.qty||0)+1; render(); };
    document.querySelector("[data-md]").onclick=()=>{ state.draft.min=Math.max(0,(+state.draft.min||0)-1); render(); };
    document.querySelector("[data-mi]").onclick=()=>{ state.draft.min=(+state.draft.min||0)+1; render(); };
    q("photoPick").onclick = () => q("photoInput").click();
    q("photoInput").onchange = e => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max=600, sc=Math.min(1, max/Math.max(img.width,img.height));
          const cv=document.createElement("canvas");
          cv.width=img.width*sc; cv.height=img.height*sc;
          cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          state.draft.photo = cv.toDataURL("image/jpeg",.8);
          render();
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    };
    q("saveBtn").onclick = () => {
      const d=state.draft;
      if(!d.name.trim()) return;
      if(d.editId){
        const it = state.items.find(i=>i.id===d.editId);
        if(it){ it.name=d.name.trim(); it.category=d.category; it.size=d.size; it.qty=+d.qty||0; it.min=+d.min||0; it.photo=d.photo; }
      } else {
        state.items.unshift({ id:uid(), name:d.name.trim(), category:d.category, size:d.size, qty:+d.qty||0, min:+d.min||0, photo:d.photo });
      }
      save(); state.modal=false; render();
    };
  }

  if(state.bulk){
    q("bulkOverlay").onclick = e => { if(e.target.id==="bulkOverlay"){ state.bulk=null; render(); } };
    q("bulkCancel").onclick = () => { state.bulk=null; render(); };
    document.querySelectorAll("[data-mode]").forEach(b=> b.onclick=()=>{ state.bulk.mode=b.dataset.mode; render(); });
    q("bulkN").oninput = e => { state.bulk.n = e.target.value; const it=state.items.find(i=>i.id===state.bulk.id); const n=Math.max(0,+e.target.value||0); const delta=state.bulk.mode==="in"?n:-n; const r=it?Math.max(0,it.qty+delta):0; const pv=document.querySelector(".bulkPreview b"); if(pv) pv.textContent=r; };
    document.querySelector("[data-bd]").onclick=()=>{ state.bulk.n=Math.max(0,(+state.bulk.n||0)-1); render(); };
    document.querySelector("[data-bi]").onclick=()=>{ state.bulk.n=(+state.bulk.n||0)+1; render(); };
    q("bulkApply").onclick = () => {
      const b=state.bulk; const it=state.items.find(i=>i.id===b.id);
      if(it){ const n=Math.max(0,+b.n||0); it.qty=Math.max(0, it.qty + (b.mode==="in"?n:-n)); save(); }
      state.bulk=null; render();
    };
  }
}

function chg(id,delta){
  const it = state.items.find(i=>i.id===id);
  if(!it) return;
  it.qty = Math.max(0, it.qty+delta);
  save(); render();
}

render();
</script>
</body>
</html>
