<body>
<div id="app"></div>

<script>
// ── ダブルタップ拡大の抑止(iPad Safari対策) ─────────────────────────
let __lastTouch = 0;
document.addEventListener("touchend", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) { __lastTouch = 0; return; }
  const now = Date.now();
  if (now - __lastTouch <= 350) { e.preventDefault(); }
  __lastTouch = now;
}, { passive:false });
document.addEventListener("gesturestart", e => e.preventDefault());

// ── アイコン ─────────────────────────
const ic = {
  plus:(s=22,w=2.5)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  minus:(s=26,w=3)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><path d="M5 12h14"/></svg>`,
  x:(s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  search:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
  cam:(s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>`,
  trash:(s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  pkg:(s=48)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>`,
  warn:(s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-9-16a2 2 0 0 0-3.4 0l-9 16A2 2 0 0 0 3 21h18a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg>`,
  xlsx:(s=17)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13l3 4M11 13l-3 4"/></svg>`,
  save:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>`,
  load:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 9l5-5 5 5M12 4v12"/></svg>`,
  pencil:(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
  merge:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6v4a4 4 0 0 0 4 4h4"/><path d="M8 18V6M16 10l4 4-4 4"/></svg>`,
};

// ── カテゴリー ─────────────────────────
const BASE_CATEGORIES = [
  { id:"koma", label:"駒", color:"#8B5E3C" },
  { id:"gen", label:"弦", color:"#C08457" },
  { id:"kataate", label:"肩当て", color:"#6B7A5A" },
  { id:"tailpiece", label:"テールピース", color:"#4A5A6B" },
  { id:"peg", label:"ペグ", color:"#7A4A4A" },
  { id:"adjuster", label:"アジャスター", color:"#9A7B4F" },
  { id:"other", label:"その他", color:"#6E6259" },
];
const CAT_COLORS = ["#5B7B8A","#8A5B7B","#7B8A5B","#8A785B","#5B8A78","#785B8A","#8A5B5B","#5B6E8A"];
const CAT_KEY = "violin_categories_v1";
const loadCats = () => { try { return JSON.parse(localStorage.getItem(CAT_KEY)) || []; } catch { return []; } };
const saveCats = arr => { try { localStorage.setItem(CAT_KEY, JSON.stringify(arr)); } catch(e){ console.error(e); } };
function buildCategories(){
  const user = loadCats();
  const base = BASE_CATEGORIES.filter(c=>c.id!=="other");
  const other = BASE_CATEGORIES.find(c=>c.id==="other");
  return [...base, ...user, other];
}
let CATEGORIES = buildCategories();
const catById = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES.find(c=>c.id==="other");

// ── サイズ ─────────────────────────
const SIZES = [
  { id:"4/4", label:"4/4" },
  { id:"3/4", label:"3/4" },
  { id:"1/2", label:"1/2" },
  { id:"1/4", label:"1/4" },
  { id:"1/8", label:"1/8" },
  { id:"none", label:"指定なし" },
];
const sizeLabel = id => (SIZES.find(s=>s.id===id) || {label:"指定なし"}).label;

// ── データ保存 ─────────────────────────
// 【ファイル正本方式】データの本体はiPad内のJSONファイル。
// localStorageは「開いている間の一時キャッシュ」に過ぎず、容量オーバーで
// 保存できなくても致命的ではない（ファイルに保存すれば残る）。
const KEY = "violin_inventory_v3";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
let __loadedCount = 0;
let __dirty = false; // ファイルに未保存の変更があるか
// キャッシュ保存: 写真を除いた軽いデータだけ localStorage に試し置き。
// 失敗しても警告しない（ファイルが正本のため）。写真はキャッシュに入れないので容量オーバーしにくい。
const save = () => {
  __dirty = true;
  try {
    const light = state.items.map(it => ({ ...it, photo: it.photo ? "__omitted__" : null }));
    localStorage.setItem(KEY, JSON.stringify(light));
  } catch(e){ /* 容量超過などは無視。ファイル保存が正本 */ }
  updateDirtyBadge();
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const SEED = [
  { id:"s1", name:"Aubert 駒 (フランス製)", category:"koma", condNew:true, condUsed:false, photo:null,
    stocks:[ {size:"4/4",qty:12,min:3}, {size:"3/4",qty:4,min:2}, {size:"1/2",qty:2,min:2} ] },
  { id:"s2", name:"Dominant A線", category:"gen", condNew:true, condUsed:false, photo:null,
    stocks:[ {size:"none",qty:8,min:4} ] },
  { id:"s3", name:"Kun 肩当て", category:"kataate", condNew:false, condUsed:true, photo:null,
    stocks:[ {size:"4/4",qty:2,min:2} ] },
];

// 読み込んだデータを安全な形に整える(構造は変えず、欠けた項目だけ補う)
function normalizeItem(it){
  let stocks = it.stocks;
  if(!Array.isArray(stocks)){
    // 旧形式(size/qty/minが直接)なら1サイズのstocksに変換。ただしデータは消さない
    stocks = [{ size:it.size||"none", qty:+it.qty||0, min:+it.min||0 }];
  }
  stocks = stocks.map(s=>({ size:s.size||"none", qty:Math.max(0,parseInt(s.qty)||0), min:Math.max(0,parseInt(s.min)||0) }));
  return {

function computeFiltered(){
  let list = state.items.filter(it => {
    if(state.filter!=="all" && it.category!==state.filter) return false;
    if(state.sizeFilter!=="all" && !(it.stocks||[]).some(r=>(r.size||"none")===state.sizeFilter)) return false;
    if(!it.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });
  if(state.sortBy==="name_asc"){
    list = list.slice().sort((a,b)=> a.name.localeCompare(b.name, "ja"));
  } else if(state.sortBy==="name_desc"){
    list = list.slice().sort((a,b)=> b.name.localeCompare(a.name, "ja"));
  }
  return list;
}

}

// ── サイズ違いを1カードにまとめる ─────────────────────────
function mergeBySizes(){
  const items = state.items;
  // グループキー: 名前 + 種類 + 新品 + 中古
  const groups = {};
  const order = [];
  items.forEach(it => {
    const key = `${it.name}||${it.category}||${it.condNew?1:0}||${it.condUsed?1:0}`;
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(it);
  });
  // 統合対象(2件以上のグループ)を数える
  const toMerge = order.filter(k => groups[k].length >= 2);
  if(toMerge.length === 0){ alert("まとめられるサイズ違いは見つかりませんでした。\n（同じ名前・種類・新品/中古の組み合わせが複数あるものが対象です）"); return; }

  const beforeCount = items.length;
  // 実行前に自動バックアップ
  backupJson();

  const merged = order.map(key => {
    const grp = groups[key];
    const base = grp[0];
    // 全アイテムの stocks を集約(同じサイズは合算)
    const sizeMap = {};
    const sizeOrder = [];
    grp.forEach(it => {
      (it.stocks||[]).forEach(r => {
        const sz = r.size || "none";
        if(!sizeMap[sz]){ sizeMap[sz] = { size:sz, qty:0, min:+r.min||0 }; sizeOrder.push(sz); }
        sizeMap[sz].qty += (+r.qty||0);
        // minは大きい方を採用
        sizeMap[sz].min = Math.max(sizeMap[sz].min, +r.min||0);
      });
    });
    // サイズ規定順に並べる
    const sizeRank = s => { const i = SIZES.findIndex(x=>x.id===s); return i<0?99:i; };
    const stocks = sizeOrder.map(s=>sizeMap[s]).sort((a,b)=>sizeRank(a.size)-sizeRank(b.size));
    // 写真は最初に見つかったもの
    const photo = grp.map(it=>it.photo).find(p=>p) || null;
    return { id:base.id, name:base.name, category:base.category, condNew:!!base.condNew, condUsed:!!base.condUsed, photo, stocks };
  });

  const afterCount = merged.length;
  state.items = merged;
  save();
  render();
  alert(`まとめました。\n${beforeCount}件 → ${afterCount}件\n\n実行前のバックアップを自動保存しています。もし結果が意図と違えば「復元」で元に戻せます。`);
}

// ── ファイルに保存 / ファイルを開く ─────────────────────────
function backupJson(){
  const data = { app:"violin-stock", version:3, savedAt:new Date().toISOString(), items:state.items, categories:loadCats() };
  const blob = new Blob([JSON.stringify(data)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url;
  a.download = `工房在庫_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  try { localStorage.setItem("violin_last_backup", String(Date.now())); } catch(e){}
  __dirty = false;
  render();
  setTimeout(()=>alert("ファイルを書き出しました。\nこのファイルをGoogleドライブなど安全な場所に保存してください。次回はこのファイルを「ファイルを開く」で読み込みます。"), 300);
}

// 最終保存からの経過
function lastBackupInfo(){
  let ts = 0;
  try { ts = +localStorage.getItem("violin_last_backup") || 0; } catch(e){}
  if(!ts) return { never:true };
  const d = new Date(ts);
  const p = n => String(n).padStart(2,"0");
  const label = `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  return { never:false, label };
}

function restoreJson(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      let items = Array.isArray(data) ? data : data.items;
      if(!Array.isArray(items)) throw new Error("形式が違います");
      const clean = items.map(it => {
        // 旧形式(sizeとqtyが直接)にも対応
        let stocks = it.stocks;
        if(!Array.isArray(stocks)){
          stocks = [{ size:it.size||"none", qty:+it.qty||0, min:+it.min||0 }];
        }
        stocks = stocks.map(s=>({ size:s.size||"none", qty:Math.max(0,parseInt(s.qty)||0), min:Math.max(0,parseInt(s.min)||0) }));
        return {
          id: it.id || uid(),
          name: String(it.name||"名称未設定"),
          category: it.category || "other",
          condNew: !!it.condNew,
          condUsed: !!it.condUsed,
          photo: it.photo || null,
          stocks,
        };
      });
      if(!confirm(`このファイル(${clean.length}件)を読み込みます。今の表示内容は置き換わります。よろしいですか?`)) return;
      if(Array.isArray(data.categories)){
        const cats = data.categories.filter(c=>c&&c.id&&c.label).map(c=>({ id:String(c.id), label:String(c.label), color:c.color||"#5B7B8A" }));
        saveCats(cats); CATEGORIES = buildCategories();
      }
      state.items = clean; __loadedCount = clean.length;
      save(); __dirty = false;
      try { localStorage.setItem("violin_last_backup", String(Date.now())); } catch(e){}
      render();
      alert(`ファイルを読み込みました（${clean.length}件）`);
    } catch(e) {
      alert("このファイルは読み込めませんでした。工房在庫のJSONファイルを選んでください。");
    }
  };
  r.readAsText(file);
}

  const s = q("search");
  if(s){
    let __composing = false;
    s.addEventListener("compositionstart", ()=>{ __composing = true; });
    s.addEventListener("compositionend", e => { __composing = false; state.search = e.target.value; refreshList(); });
    s.addEventListener("input", e => {
      // 日本語変換の確定前(composition中)は反応しない=二重入力・文字化け防止
      if(__composing) return;
      state.search = e.target.value;
      refreshList();
    });
  }
  if(q("clearSearch")) q("clearSearch").onclick = () => { state.search=""; render(); };

  document.querySelectorAll("[data-cat]").forEach(b=> b.onclick=()=>{ state.filter=b.dataset.cat; render(); });
  document.querySelectorAll("[data-sort]").forEach(b=> b.onclick=()=>{ state.sortBy=b.dataset.sort; render(); });
  document.querySelectorAll("[data-size]").forEach(b=>{
    if(b.hasAttribute("data-inc")||b.hasAttribute("data-dec")) return; // カウンターは別処理
    b.onclick=()=>{ state.sizeFilter=b.dataset.size; render(); };
  });
  // サイズ別カウンター
  bindListEvents();

  if(state.modal) bindModal(q);
  if(state.bulk) bindBulk(q);
}

// リスト内のボタンのイベント(検索でリストだけ更新したときも貼り直す)
function bindListEvents(){
  document.querySelectorAll("[data-inc]").forEach(b=> b.onclick=()=>{ chgSize(b.dataset.inc, b.dataset.size, 1); });
  document.querySelectorAll("[data-dec]").forEach(b=> b.onclick=()=>{ chgSize(b.dataset.dec, b.dataset.size, -1); });
  document.querySelectorAll("[data-bulk]").forEach(b=> b.onclick=()=>{ state.bulk={ id:b.dataset.bulk, mode:"in", n:10, size:null }; render(); });
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{ if(confirm("このパーツを削除しますか?")){ state.items=state.items.filter(i=>i.id!==b.dataset.del); save(); render(); } });
  document.querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=>{
    const it = state.items.find(i=>i.id===b.dataset.edit);
    if(!it) return;
    const stocks = {};
    (it.stocks||[]).forEach(r=>{ stocks[r.size] = { on:true, qty:+r.qty||0, min:+r.min||0 }; });
    state.draft = { editId:it.id, name:it.name, category:it.category, photo:it.photo||null, condNew:!!it.condNew, condUsed:!!it.condUsed, stocks };
    state.modal = true; render();
  });
}

// 検索・並びでリスト部分だけ更新(入力欄のフォーカスを保つ)
function refreshList(){
  const area = document.getElementById("listArea");
  if(!area) { render(); return; }
  area.innerHTML = listHtml(computeFiltered());
  bindListEvents();
}

function bindModal(q){
  q("overlay").onclick = e => { if(e.target.id==="overlay"){ state.modal=false; render(); } };
  q("closeModal").onclick = q("cancelBtn").onclick = () => { state.modal=false; render(); };
  q("dName").oninput = e => { state.draft.name=e.target.value; q("saveBtn").disabled=!e.target.value.trim(); };
  q("condNewBtn").onclick = () => { state.draft.condNew=!state.draft.condNew; render(); };
  q("condUsedBtn").onclick = () => { state.draft.condUsed=!state.draft.condUsed; render(); };
  document.querySelectorAll("[data-c]").forEach(b=> b.onclick=()=>{ state.draft.category=b.dataset.c; render(); });
  q("addCatBtn").onclick = () => {
    const name = (prompt("追加する種類の名前を入力してください（例：あご当て、松脂、弓）") || "").trim();
    if(!name) return;
    const dup = CATEGORIES.find(c=>c.label===name);
    if(dup){ state.draft.category=dup.id; render(); return; }
    const user = loadCats();
    const newCat = { id:"u"+uid(), label:name, color:CAT_COLORS[user.length % CAT_COLORS.length] };
    user.push(newCat); saveCats(user); CATEGORIES = buildCategories();
    state.draft.category = newCat.id; render();
  };

  // サイズのオン/オフ・数量
  document.querySelectorAll("[data-sztoggle]").forEach(b=> b.onclick=()=>{
    const id=b.dataset.sztoggle; const st=state.draft.stocks;
    if(st[id] && st[id].on){ st[id].on=false; } else { st[id]={ on:true, qty:(st[id]?st[id].qty:1), min:(st[id]?st[id].min:2) }; }
    render();
  });
  document.querySelectorAll("[data-szq]").forEach(inp=> inp.oninput=e=>{ state.draft.stocks[inp.dataset.szq].qty=e.target.value; });
  document.querySelectorAll("[data-szm]").forEach(inp=> inp.oninput=e=>{ state.draft.stocks[inp.dataset.szm].min=e.target.value; });
  document.querySelectorAll("[data-szqd]").forEach(b=> b.onclick=()=>{ const id=b.dataset.szqd; const r=state.draft.stocks[id]; r.qty=Math.max(0,(+r.qty||0)-1); const inp=document.querySelector(`[data-szq="${id}"]`); if(inp) inp.value=r.qty; });
  document.querySelectorAll("[data-szqi]").forEach(b=> b.onclick=()=>{ const id=b.dataset.szqi; const r=state.draft.stocks[id]; r.qty=(+r.qty||0)+1; const inp=document.querySelector(`[data-szq="${id}"]`); if(inp) inp.value=r.qty; });
  document.querySelectorAll("[data-szmd]").forEach(b=> b.onclick=()=>{ const id=b.dataset.szmd; const r=state.draft.stocks[id]; r.min=Math.max(0,(+r.min||0)-1); const inp=document.querySelector(`[data-szm="${id}"]`); if(inp) inp.value=r.min; });
  document.querySelectorAll("[data-szmi]").forEach(b=> b.onclick=()=>{ const id=b.dataset.szmi; const r=state.draft.stocks[id]; r.min=(+r.min||0)+1; const inp=document.querySelector(`[data-szm="${id}"]`); if(inp) inp.value=r.min; });

  q("photoPick").onclick = () => q("photoInput").click();
  q("photoInput").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max=600, sc=Math.min(1, max/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=img.width*sc; cv.height=img.height*sc;
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        state.draft.photo = cv.toDataURL("image/jpeg",.8);
        render();
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };

  q("saveBtn").onclick = () => {
    const d=state.draft;
    if(!d.name.trim()) return;
    // オンのサイズだけ stocks 配列に
    const stocks = SIZES.filter(s=>d.stocks[s.id] && d.stocks[s.id].on)
      .map(s=>({ size:s.id, qty:+d.stocks[s.id].qty||0, min:+d.stocks[s.id].min||0 }));
    if(stocks.length===0){ alert("サイズを1つ以上オンにして在庫を入力してください"); return; }
    if(d.editId){
      const it = state.items.find(i=>i.id===d.editId);
      if(it){ it.name=d.name.trim(); it.category=d.category; it.photo=d.photo; it.condNew=!!d.condNew; it.condUsed=!!d.condUsed; it.stocks=stocks; }
    } else {
      state.items.unshift({ id:uid(), name:d.name.trim(), category:d.category, photo:d.photo, condNew:!!d.condNew, condUsed:!!d.condUsed, stocks });
    }
    save(); state.modal=false; render();
  };
}

function bindBulk(q){
  q("bulkOverlay").onclick = e => { if(e.target.id==="bulkOverlay"){ state.bulk=null; render(); } };
  q("bulkCancel").onclick = () => { state.bulk=null; render(); };
  document.querySelectorAll("[data-bsize]").forEach(b=> b.onclick=()=>{ state.bulk.size=b.dataset.bsize; render(); });
  document.querySelectorAll("[data-mode]").forEach(b=> b.onclick=()=>{ state.bulk.mode=b.dataset.mode; render(); });
  q("bulkN").oninput = e => { state.bulk.n=e.target.value; render(); };
  document.querySelector("[data-bd]").onclick=()=>{ state.bulk.n=Math.max(0,(+state.bulk.n||0)-1); render(); };
  document.querySelector("[data-bi]").onclick=()=>{ state.bulk.n=(+state.bulk.n||0)+1; render(); };
  q("bulkApply").onclick = () => {
    const b=state.bulk; const it=state.items.find(i=>i.id===b.id);
    if(it){ const r=(it.stocks||[]).find(x=>x.size===b.size); if(r){ const n=Math.max(0,+b.n||0); r.qty=Math.max(0, (+r.qty||0) + (b.mode==="in"?n:-n)); save(); } }
    state.bulk=null; render();
  };
}

function chgSize(itemId, size, delta){
  const it = state.items.find(i=>i.id===itemId);
  if(!it) return;
  const r = (it.stocks||[]).find(x=>x.size===size);
  if(!r) return;
  r.qty = Math.max(0, (+r.qty||0)+delta);
  save();
  const y = window.scrollY;          // 今の表示位置を覚える
  render();
  window.scrollTo(0, y);             // 元の位置に戻す
}

render();

// 未保存のまま閉じ/離脱しようとしたら警告
window.addEventListener("beforeunload", e => {
  if(__dirty){ e.preventDefault(); e.returnValue = ""; }
});

// 起動時: 保存済みファイルを開くよう案内(一度だけ)
(function(){
  try {
    if(sessionStorage.getItem("__opened_notice__")) return;
    sessionStorage.setItem("__opened_notice__", "1");
  } catch(e){}
  setTimeout(()=>{
    alert("この画面は前回の作業内容の仮表示です（写真は表示されていない場合があります）。\n\n最新の在庫を見るには、右上の「ファイルを開く」からGoogleドライブなどに保存したJSONファイルを読み込んでください。\n\n作業して変更したら、必ず「ファイルに保存」で書き出してください。");
  }, 500);
})();
</script>
