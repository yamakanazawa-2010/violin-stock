<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工房在庫">
<meta name="theme-color" content="#f7f3ec">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%233d332a'/%3E%3Ctext x='90' y='122' font-size='90' text-anchor='middle' fill='%23f7f3ec' font-family='sans-serif' font-weight='bold'%3E駒%3C/text%3E%3C/svg%3E">
<title>工房パーツ在庫</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  input { -webkit-user-select:text; user-select:text; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  html,body { background:#f7f3ec; color:#2f2820; font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif; }
  body { padding-bottom:40px; -webkit-overflow-scrolling:touch; }
  button:active { transform:scale(0.96); transition:transform .05s; }
  ::-webkit-scrollbar { height:0; width:0; }

  .wrap { max-width:900px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:flex-start; padding:calc(env(safe-area-inset-top) + 20px) 20px 16px; }
  h1 { font-size:28px; font-weight:800; letter-spacing:.02em; }
  .sub { margin-top:6px; font-size:14px; color:#7a6f62; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .lowBadge { display:inline-flex; align-items:center; gap:4px; background:#fbe9d6; color:#c07a1e; padding:2px 9px; border-radius:999px; font-size:12.5px; font-weight:700; }
  .addBtn { display:flex; align-items:center; gap:6px; background:#3d332a; color:#fff; border:none; border-radius:14px; padding:12px 18px; font-size:16px; font-weight:700; box-shadow:0 3px 10px rgba(61,51,42,.25); }

  .searchWrap { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #e7ded0; border-radius:14px; padding:12px 16px; margin:0 20px; }
  .searchWrap input { flex:1; border:none; outline:none; font-size:17px; background:transparent; color:#2f2820; }
  .clearBtn { border:none; background:#f0e9dd; color:#7a6f62; border-radius:999px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }

  .chips { display:flex; gap:8px; overflow-x:auto; padding:16px 20px; }
  .chip { flex-shrink:0; background:#fff; border:1.5px solid #e7ded0; color:#6e6259; border-radius:999px; padding:9px 18px; font-size:15px; font-weight:700; white-space:nowrap; }

  .list { display:flex; flex-direction:column; gap:12px; padding:0 20px; }
  .card { position:relative; display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #ece4d6; border-radius:18px; padding:14px 16px; box-shadow:0 1px 3px rgba(61,51,42,.06); }
  .card.low { border-color:#f0d0a0; background:#fffdf8; }
  .card.out { border-color:#e6b3b3; background:#fef7f6; }
  .thumb { width:62px; height:62px; border-radius:12px; overflow:hidden; flex-shrink:0; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumbPh { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:26px; font-weight:800; }
  .body { flex:1; min-width:0; }
  .cardTop { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .catTag { font-size:11.5px; font-weight:800; border:1.2px solid; border-radius:6px; padding:1px 7px; }
  .statusLow { font-size:11.5px; font-weight:800; color:#c07a1e; background:#fbe9d6; border-radius:6px; padding:1px 7px; }
  .statusOut { font-size:11.5px; font-weight:800; color:#b23b3b; background:#fadede; border-radius:6px; padding:1px 7px; }
  .name { margin:2px 0; font-size:17px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .minText { font-size:12.5px; color:#9a8f82; }
  .counter { display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .stepBtn { width:48px; height:48px; border-radius:12px; border:none; background:#f0e9dd; color:#3d332a; display:flex; align-items:center; justify-content:center; }
  .stepBtn:disabled { opacity:.4; }
  .qtyBox { display:flex; flex-direction:column; align-items:center; min-width:52px; }
  .qtyNum { font-size:28px; font-weight:800; line-height:1; }
  .qtyUnit { font-size:11px; color:#9a8f82; margin-top:1px; }
  .delBtn { position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:8px; border:none; background:transparent; color:#c9bcac; display:flex; align-items:center; justify-content:center; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; color:#9a8f82; }
  .empty p.t { margin:12px 0 4px; font-weight:600; color:#6e6259; }

  .overlay { position:fixed; inset:0; background:rgba(47,40,32,.5); display:flex; align-items:flex-end; justify-content:center; z-index:100; }
  .modal { background:#f7f3ec; border-radius:24px 24px 0 0; width:100%; max-width:560px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.2); padding-bottom:env(safe-area-inset-bottom); }
  .modalHead { display:flex; justify-content:space-between; align-items:center; padding:20px 20px 12px; }
  .modalHead h2 { font-size:22px; font-weight:800; }
  .modalClose { border:none; background:#ece4d6; color:#6e6259; border-radius:999px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; }
  .modalBody { padding:0 20px; overflow-y:auto; flex:1; }
  .modalFoot { display:flex; gap:12px; padding:20px; }
  .photoPick { width:100%; height:150px; border:2px dashed #d9cdbb; border-radius:16px; background:#fff; overflow:hidden; padding:0; margin-bottom:8px; }
  .photoEmpty { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#a89b8c; }
  .photoEmpty span { font-size:14px; color:#9a8f82; margin-top:6px; }
  .photoPick img { width:100%; height:100%; object-fit:cover; }
  label.lb { display:block; font-size:14px; font-weight:700; color:#7a6f62; margin:16px 0 7px; }
  .field { width:100%; border:1.5px solid #e2d8c8; border-radius:12px; padding:13px 15px; font-size:17px; outline:none; background:#fff; color:#2f2820; }
  .catGrid { display:flex; flex-wrap:wrap; gap:8px; }
  .catOption { border:1.5px solid #e2d8c8; background:#fff; color:#6e6259; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:700; }
  .row { display:flex; gap:14px; }
  .numField { display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid #e2d8c8; border-radius:12px; padding:5px; }
  .numBtn { width:42px; height:42px; border-radius:9px; border:none; background:#f0e9dd; color:#3d332a; display:flex; align-items:center; justify-content:center; }
  .numInput { flex:1; width:100%; min-width:0; border:none; outline:none; text-align:center; font-size:20px; font-weight:800; background:transparent; color:#2f2820; }
  .cancelBtn { flex:1; border:1.5px solid #d9cdbb; background:transparent; color:#6e6259; border-radius:14px; padding:15px; font-size:17px; font-weight:700; }
  .saveBtn { flex:2; border:none; background:#3d332a; color:#fff; border-radius:14px; padding:15px; font-size:17px; font-weight:800; }
  .saveBtn:disabled { opacity:.4; }
  svg { display:block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── アイコン(inline SVG) ─────────────────────────
const ic = {
  plus:(s=22,w=2.5)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  minus:(s=26,w=3)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><path d="M5 12h14"/></svg>`,
  x:(s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  search:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
  cam:(s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>`,
  trash:(s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  pkg:(s=48)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>`,
  warn:(s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-9-16a2 2 0 0 0-3.4 0l-9 16A2 2 0 0 0 3 21h18a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg>`,
};

// ── カテゴリー ─────────────────────────
const CATEGORIES = [
  { id:"koma", label:"駒", color:"#8B5E3C" },
  { id:"gen", label:"弦", color:"#C08457" },
  { id:"kataate", label:"肩当て", color:"#6B7A5A" },
  { id:"tailpiece", label:"テールピース", color:"#4A5A6B" },
  { id:"peg", label:"ペグ", color:"#7A4A4A" },
  { id:"adjuster", label:"アジャスター", color:"#9A7B4F" },
  { id:"other", label:"その他", color:"#6E6259" },
];
const catById = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES[6];

// ── データ保存(localStorage) ─────────────────────────
const KEY = "violin_inventory_v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state.items)); } catch(e){ console.error(e); } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const SEED = [
  { id:"s1", name:"Aubert 駒 (フランス製)", category:"koma", qty:12, min:3, photo:null },
  { id:"s2", name:"Dominant A線", category:"gen", qty:8, min:4, photo:null },
  { id:"s3", name:"Kun 肩当て", category:"kataate", qty:2, min:2, photo:null },
  { id:"s4", name:"黒檀ペグ 4本セット", category:"peg", qty:5, min:2, photo:null },
];

const state = { items: load() ?? SEED, filter:"all", search:"", modal:false, draft:null };
if(!load()) save();

const esc = s => String(s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// ── 描画 ─────────────────────────
function render(){
  const app = document.getElementById("app");
  const items = state.items;
  const low = items.filter(i=>i.qty<=i.min).length;
  const total = items.reduce((s,i)=>s+i.qty,0);
  const filtered = items.filter(i =>
    (state.filter==="all" || i.category===state.filter) &&
    i.name.toLowerCase().includes(state.search.toLowerCase())
  );

  app.innerHTML = `
    <div class="wrap">
      <header>
        <div>
          <h1>工房パーツ在庫</h1>
          <div class="sub">
            ${items.length} 種類 ・ 合計 ${total} 個
            ${low>0 ? `<span class="lowBadge">${ic.warn()} 要補充 ${low}</span>` : ""}
          </div>
        </div>
        <button class="addBtn" id="openAdd">${ic.plus()}<span>追加</span></button>
      </header>

      <div class="searchWrap">
        ${ic.search()}
        <input id="search" placeholder="パーツ名で検索" value="${esc(state.search)}">
        ${state.search ? `<button class="clearBtn" id="clearSearch">${ic.x(18)}</button>` : ""}
      </div>

      <div class="chips" id="chips">
        <button class="chip" data-cat="all" style="${state.filter==="all"?"background:#3d332a;color:#fff;border-color:#3d332a":""}">すべて</button>
        ${CATEGORIES.map(c=>`<button class="chip" data-cat="${c.id}" style="${state.filter===c.id?`background:${c.color};color:#fff;border-color:${c.color}`:""}">${c.label}</button>`).join("")}
      </div>

      <div class="list">
        ${filtered.length===0 ? `
          <div class="empty">
            ${ic.pkg()}
            <p class="t">該当するパーツがありません</p>
            <p style="font-size:14px">右上の「追加」から登録できます</p>
          </div>` :
          filtered.map(cardHtml).join("")}
      </div>
    </div>
    ${state.modal ? modalHtml() : ""}
  `;
  bind();
}

function cardHtml(it){
  const cat = catById(it.category);
  const low = it.qty<=it.min, out = it.qty===0;
  const numColor = out?"#b23b3b":low?"#c07a1e":"#2f2820";
  return `
    <div class="card ${out?"out":low?"low":""}">
      <div class="thumb">
        ${it.photo ? `<img src="${it.photo}" alt="">` :
          `<div class="thumbPh" style="background:${cat.color}">${cat.label.slice(0,1)}</div>`}
      </div>
      <div class="body">
        <div class="cardTop">
          <span class="catTag" style="color:${cat.color};border-color:${cat.color}">${cat.label}</span>
          ${out?`<span class="statusOut">在庫切れ</span>`:low?`<span class="statusLow">残りわずか</span>`:""}
        </div>
        <div class="name">${esc(it.name)}</div>
        <div class="minText">最低在庫 ${it.min}</div>
      </div>
      <div class="counter">
        <button class="stepBtn" data-dec="${it.id}" ${it.qty===0?"disabled":""}>${ic.minus()}</button>
        <div class="qtyBox">
          <span class="qtyNum" style="color:${numColor}">${it.qty}</span>
          <span class="qtyUnit">個</span>
        </div>
        <button class="stepBtn" data-inc="${it.id}">${ic.plus(26,3)}</button>
      </div>
      <button class="delBtn" data-del="${it.id}">${ic.trash()}</button>
    </div>`;
}

function modalHtml(){
  const d = state.draft;
  return `
    <div class="overlay" id="overlay">
      <div class="modal" id="modal">
        <div class="modalHead">
          <h2>パーツを追加</h2>
          <button class="modalClose" id="closeModal">${ic.x()}</button>
        </div>
        <div class="modalBody">
          <button class="photoPick" id="photoPick">
            ${d.photo ? `<img src="${d.photo}" alt="">` :
              `<div class="photoEmpty">${ic.cam()}<span>写真を追加</span></div>`}
          </button>
          <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

          <label class="lb">パーツ名</label>
          <input class="field" id="dName" value="${esc(d.name)}" placeholder="例）Aubert 駒 フランス製">

          <label class="lb">カテゴリー</label>
          <div class="catGrid" id="catGrid">
            ${CATEGORIES.map(c=>`<button class="catOption" data-c="${c.id}" style="${d.category===c.id?`background:${c.color};color:#fff;border-color:${c.color}`:""}">${c.label}</button>`).join("")}
          </div>

          <div class="row">
            <div style="flex:1">
              <label class="lb">初期在庫数</label>
              <div class="numField">
                <button class="numBtn" data-qd>${ic.minus(20,3)}</button>
                <input class="numInput" id="dQty" type="number" value="${d.qty}">
                <button class="numBtn" data-qi>${ic.plus(20,3)}</button>
              </div>
            </div>
            <div style="flex:1">
              <label class="lb">最低在庫数</label>
              <div class="numField">
                <button class="numBtn" data-md>${ic.minus(20,3)}</button>
                <input class="numInput" id="dMin" type="number" value="${d.min}">
                <button class="numBtn" data-mi>${ic.plus(20,3)}</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modalFoot">
          <button class="cancelBtn" id="cancelBtn">キャンセル</button>
          <button class="saveBtn" id="saveBtn" ${d.name.trim()?"":"disabled"}>登録する</button>
        </div>
      </div>
    </div>`;
}

// ── イベント ─────────────────────────
function bind(){
  const q = id => document.getElementById(id);

  q("openAdd").onclick = () => { state.draft={ name:"", category:"koma", qty:1, min:2, photo:null }; state.modal=true; render(); };

  const s = q("search");
  if(s) s.oninput = e => { state.search=e.target.value; const p=e.target.selectionStart; render(); const n=document.getElementById("search"); if(n){ n.focus(); n.setSelectionRange(p,p);} };
  if(q("clearSearch")) q("clearSearch").onclick = () => { state.search=""; render(); };

  document.querySelectorAll("[data-cat]").forEach(b=> b.onclick=()=>{ state.filter=b.dataset.cat; render(); });
  document.querySelectorAll("[data-inc]").forEach(b=> b.onclick=()=>{ chg(b.dataset.inc,1); });
  document.querySelectorAll("[data-dec]").forEach(b=> b.onclick=()=>{ chg(b.dataset.dec,-1); });
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{ if(confirm("このパーツを削除しますか?")){ state.items=state.items.filter(i=>i.id!==b.dataset.del); save(); render(); } });

  if(state.modal){
    q("overlay").onclick = e => { if(e.target.id==="overlay"){ state.modal=false; render(); } };
    q("closeModal").onclick = q("cancelBtn").onclick = () => { state.modal=false; render(); };
    q("dName").oninput = e => { state.draft.name=e.target.value; q("saveBtn").disabled=!e.target.value.trim(); };
    document.querySelectorAll("[data-c]").forEach(b=> b.onclick=()=>{ state.draft.category=b.dataset.c; render(); });
    q("dQty").oninput = e => state.draft.qty = e.target.value;
    q("dMin").oninput = e => state.draft.min = e.target.value;
    q("[data-qd]") && document.querySelector("[data-qd]") ;
    document.querySelector("[data-qd]").onclick=()=>{ state.draft.qty=Math.max(0,(+state.draft.qty||0)-1); render(); };
    document.querySelector("[data-qi]").onclick=()=>{ state.draft.qty=(+state.draft.qty||0)+1; render(); };
    document.querySelector("[data-md]").onclick=()=>{ state.draft.min=Math.max(0,(+state.draft.min||0)-1); render(); };
    document.querySelector("[data-mi]").onclick=()=>{ state.draft.min=(+state.draft.min||0)+1; render(); };
    q("photoPick").onclick = () => q("photoInput").click();
    q("photoInput").onchange = e => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max=600, sc=Math.min(1, max/Math.max(img.width,img.height));
          const cv=document.createElement("canvas");
          cv.width=img.width*sc; cv.height=img.height*sc;
          cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          state.draft.photo = cv.toDataURL("image/jpeg",.8);
          render();
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    };
    q("saveBtn").onclick = () => {
      const d=state.draft;
      if(!d.name.trim()) return;
      state.items.unshift({ id:uid(), name:d.name.trim(), category:d.category, qty:+d.qty||0, min:+d.min||0, photo:d.photo });
      save(); state.modal=false; render();
    };
  }
}

function chg(id,delta){
  const it = state.items.find(i=>i.id===id);
  if(!it) return;
  it.qty = Math.max(0, it.qty+delta);
  save(); render();
}

render();
</script>
</body>
</html>
